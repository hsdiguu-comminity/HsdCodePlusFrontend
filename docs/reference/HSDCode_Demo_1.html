<title>HSDCode+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: conventional dev-community site — sticky top nav, 1180px content column, cards only where an item is a separate object. Accent = logo purple. */
:root{
  --bg:#FAF9FD; --surface:#FFFFFF; --surface-2:#F2F0F8; --border:#E3E0EC;
  --fg:#1B1924; --muted:#615D70; --logo-gray:#555459;
  --accent:#6016E5; --accent-hover:#4E0FC0; --accent-soft:#EFE8FD; --on-accent:#FFFFFF;
  --code-bg:#17141F; --code-fg:#E7E2F4; --code-muted:#8E87A3; --code-key:#B794FF; --code-str:#7FD6A7;
  --good:#18794E; --good-soft:#E3F4EA; --warn:#9A5B00; --warn-soft:#FDF1DC; --bad:#B42323; --bad-soft:#FBE6E6;
  --gold:#B7860B; --silver:#7A8190; --bronze:#A0592B;
  --shadow:0 1px 2px rgba(30,20,60,.05),0 4px 16px rgba(30,20,60,.05);
  --font-display:"Poppins",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0D15; --surface:#17141F; --surface-2:#1F1B2A; --border:#2D2839;
  --fg:#ECE9F5; --muted:#A49EB6; --logo-gray:#CFCBD9;
  --accent:#9466FF; --accent-hover:#A985FF; --accent-soft:#261C42; --on-accent:#FFFFFF;
  --code-bg:#0B0910; --code-fg:#E7E2F4; --code-muted:#857E99; --code-key:#B794FF; --code-str:#7FD6A7;
  --good:#4CC38A; --good-soft:#12291E; --warn:#E3A33B; --warn-soft:#2B2110; --bad:#F07171; --bad-soft:#2E1414;
  --gold:#E2B33C; --silver:#AEB4C0; --bronze:#D08A5A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0D15; --surface:#17141F; --surface-2:#1F1B2A; --border:#2D2839;
  --fg:#ECE9F5; --muted:#A49EB6; --logo-gray:#CFCBD9;
  --accent:#9466FF; --accent-hover:#A985FF; --accent-soft:#261C42; --on-accent:#FFFFFF;
  --code-bg:#0B0910; --code-fg:#E7E2F4; --code-muted:#857E99; --code-key:#B794FF; --code-str:#7FD6A7;
  --good:#4CC38A; --good-soft:#12291E; --warn:#E3A33B; --warn-soft:#2B2110; --bad:#F07171; --bad-soft:#2E1414;
  --gold:#E2B33C; --silver:#AEB4C0; --bronze:#D08A5A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.25;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.2vw,42px);font-weight:700}
h2{font-size:24px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.tnum{font-variant-numeric:tabular-nums}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-in{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);flex-shrink:0}
.brand:hover{text-decoration:none}
.brand img{height:22px;width:auto}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.wordmark .g{color:var(--logo-gray)}.wordmark .p{color:var(--accent)}
.links{display:flex;gap:4px;flex:1}
.links a{color:var(--muted);padding:8px 12px;border-radius:8px;font-weight:500;font-size:14.5px}
.links a:hover{color:var(--fg);background:var(--surface-2);text-decoration:none}
.links a.on{color:var(--accent);background:var(--accent-soft)}
.nav-r{display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.me{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-weight:500;font-size:14px}
.me:hover{text-decoration:none;background:var(--surface-2)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-family:var(--font-display);font-weight:600;font-size:12px;flex-shrink:0}
.av.lg{width:96px;height:96px;font-size:32px}
.av.md{width:40px;height:40px;font-size:14px}
.av.alt{background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
.burger{display:none}
@media (max-width:900px){
  .burger{display:grid}
  .links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px 16px}
  .links.open{display:flex}
  .me span:not(.av){display:none}
  .me{padding:4px}
}

/* generic */
main{padding-block:32px 64px;min-height:70vh}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head p{margin-top:6px;color:var(--muted);max-width:60ch}
.eyebrow{font-family:var(--font-mono);font-size:12.5px;color:var(--accent);letter-spacing:.02em;margin-bottom:8px;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14.5px;background:var(--accent);color:var(--on-accent)}
.btn:hover{background:var(--accent-hover);text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.cat{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.draft{background:var(--surface-2);color:var(--muted)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500}
.filters button:hover{color:var(--fg)}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.section{margin-top:48px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.grid3{grid-template-columns:minmax(0,1fr)}}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label{font-size:13.5px;font-weight:500;display:block;margin-bottom:6px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:24px 8px}
.hero p.lead{font-size:17px;color:var(--muted);margin-top:16px;max-width:52ch}
.hero .cta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.hero h1 .p{color:var(--accent)}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);gap:32px}}
.term{background:var(--code-bg);color:var(--code-fg);border-radius:12px;font-family:var(--font-mono);font-size:13.5px;line-height:1.75;overflow:hidden;box-shadow:var(--shadow)}
.term-top{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.07);color:var(--code-muted);font-size:12px}
.term-top i{width:10px;height:10px;border-radius:50%;background:#3A3448;display:inline-block}
.term-top span{margin-left:8px}
.term pre{margin:0;padding:16px 18px;overflow-x:auto;white-space:pre}
.term .c{color:var(--code-muted)}.term .k{color:var(--code-key)}.term .s{color:var(--code-str)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-top:40px}
.stats div{padding:18px 20px;border-left:1px solid var(--border)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--font-display);font-size:26px;font-weight:600}
.stats span{color:var(--muted);font-size:13.5px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats div:nth-child(3){border-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--border)}}

/* post cards */
.post{display:flex;flex-direction:column;gap:10px;padding:20px;color:var(--fg);transition:border-color .15s}
.post:hover{text-decoration:none;border-color:var(--accent)}
.post .meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.post p{color:var(--muted);font-size:14.5px}
.post .by{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;font-size:13.5px}
.post .by .av{width:26px;height:26px;font-size:11px}

/* home split */
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.quiz-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--border)}
.quiz-row:first-child{border-top:0}
.qi{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-weight:500;font-size:13px;flex-shrink:0}
.quiz-row .t{flex:1;min-width:0}
.quiz-row .t b{display:block;font-weight:600;font-size:14.5px}
.quiz-row .t span{font-size:13px;color:var(--muted)}
.mini-lb li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--border)}
.mini-lb li:first-child{border-top:0}
.mini-lb{list-style:none;margin:0;padding:0}
.rank{width:22px;font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:right}
.mini-lb .n{flex:1;min-width:0;font-size:14px}
.mini-lb .n small{display:block;color:var(--muted);font-size:12px}
.mini-lb .pts{font-family:var(--font-mono);font-size:13.5px;font-weight:500}
.card-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-h h3{font-size:15px}

/* quiz */
.quiz-card{padding:20px;display:flex;flex-direction:column;gap:12px}
.quiz-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.quiz-card p{color:var(--muted);font-size:14px}
.quiz-card .facts{display:flex;gap:16px;font-size:13px;color:var(--muted);font-family:var(--font-mono);flex-wrap:wrap}
.quiz-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.lvl{font-size:12px;font-weight:600}
.lvl.e{color:var(--good)}.lvl.m{color:var(--warn)}.lvl.h{color:var(--bad)}
.play{max-width:720px;margin:0 auto}
.play-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.timer{font-family:var(--font-mono);font-size:15px;padding:6px 12px;border-radius:8px;background:var(--surface-2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qbox{padding:28px}
.qbox h2{font-size:20px;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--font-mono);font-size:13px;flex-shrink:0}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.result{text-align:center;padding:40px 28px}
.result .score{font-family:var(--font-display);font-size:56px;font-weight:700;color:var(--accent);line-height:1.1;margin-block:8px}
.result .acts{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}

/* blog */
.blog-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.blog-tools input{max-width:280px}
.article{max-width:740px;margin:0 auto}
.article .meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin-top:16px;flex-wrap:wrap}
.article .body{margin-top:32px;font-size:16.5px;line-height:1.75}
.article .body p{margin-bottom:18px}
.article .body h3{font-size:20px;margin:32px 0 12px}
.article .body code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-2);padding:2px 6px;border-radius:5px}
.article .body pre{background:var(--code-bg);color:var(--code-fg);padding:18px;border-radius:10px;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px;line-height:1.7;margin:0 0 20px}
.article .body pre code{background:none;padding:0;color:inherit;font-size:inherit}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-bottom:24px;background:none;border:0;padding:0}
.back:hover{color:var(--fg)}
.editor{display:grid;gap:16px;max-width:820px}
.editor .row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:620px){.editor .row{grid-template-columns:minmax(0,1fr)}}
.editor textarea{min-height:260px;font-family:var(--font-mono);font-size:14px;line-height:1.6}
.note{padding:12px 16px;border-radius:8px;background:var(--accent-soft);color:var(--fg);font-size:14px}

/* leaderboard */
.lb-tools{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.lb-tools select{width:auto}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px;align-items:end}
.pod{padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.pod:hover{border-color:var(--accent)}
.pod .medal{font-family:var(--font-mono);font-size:13px;font-weight:500}
.pod.p1{order:2;padding-block:28px}.pod.p2{order:1}.pod.p3{order:3}
.pod.p1 .medal{color:var(--gold)}.pod.p2 .medal{color:var(--silver)}.pod.p3 .medal{color:var(--bronze)}
.pod b{font-size:15px}
.pod small{color:var(--muted);font-size:13px}
.pod .pts{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--accent)}
@media (max-width:620px){.podium{grid-template-columns:minmax(0,1fr)}.pod.p1,.pod.p2,.pod.p3{order:0}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tr.self td{background:var(--accent-soft)}
.who{display:flex;align-items:center;gap:10px}
.delta{font-family:var(--font-mono);font-size:12.5px}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.eq{color:var(--muted)}
th.r,td.r{text-align:right}

/* about */
.about-hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:center}
.about-hero p{color:var(--muted);font-size:16.5px;margin-top:14px;max-width:60ch}
.logo-tile{background:#FFFFFF;border:1px solid var(--border);border-radius:14px;display:grid;place-items:center;padding:40px}
.logo-tile img{width:min(260px,100%)}
@media (max-width:900px){.about-hero{grid-template-columns:minmax(0,1fr)}}
.values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.values div{border-top:2px solid var(--accent);padding-top:14px}
.values p{color:var(--muted);font-size:14.5px;margin-top:6px}
@media (max-width:620px){.values{grid-template-columns:minmax(0,1fr)}}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.member{padding:20px;display:flex;gap:14px;align-items:flex-start}
.member b{display:block;font-size:15.5px}
.member .role{font-size:13px;color:var(--accent);font-weight:500}
.member p{font-size:13.5px;color:var(--muted);margin-top:6px}
@media (max-width:900px){.team{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.team{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;gap:8px;flex-wrap:wrap}
.stack .chip{font-family:var(--font-mono);font-size:13px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);color:var(--fg)}

/* profile */
.prof{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.prof{grid-template-columns:minmax(0,1fr)}}
.prof-side{padding:24px;display:flex;flex-direction:column;gap:14px}
.prof-side h2{font-size:22px}
.prof-side .handle{font-family:var(--font-mono);color:var(--muted);font-size:13.5px}
.prof-side .bio{font-size:14.5px}
.prof-side ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.prof-side li span{color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:var(--font-display);font-size:24px;font-weight:600;margin-top:2px}
.kpi small{font-size:12.5px;color:var(--good);font-family:var(--font-mono)}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.heat-wrap{padding:16px 20px;overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px;margin-top:10px}
.heat i{border-radius:2px;background:var(--surface-2)}
.heat i.l1{background:var(--accent);opacity:.3}.heat i.l2{background:var(--accent);opacity:.55}.heat i.l3{background:var(--accent);opacity:.8}.heat i.l4{background:var(--accent)}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:10px;justify-content:flex-end}
.heat-legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:0;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;color:var(--muted);font-weight:500;font-size:14.5px;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);padding:1px 7px;border-radius:99px;margin-left:6px}
.list-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.list-row:first-child{border-top:0}
.list-row .t{flex:1;min-width:200px}
.list-row .t b{display:block;font-weight:600;font-size:14.5px}
.list-row .t span{font-size:13px;color:var(--muted)}
.list-row .acts{display:flex;gap:8px}
.admin-h{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--border)}
.admin-h:first-child{border-top:0}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:14px}

/* footer, toast */
footer{border-top:1px solid var(--border);padding-block:28px;font-size:13.5px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer .wordmark{font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.demo-flag{font-family:var(--font-mono);font-size:12px;padding:2px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  {id:"p1", cat:"Web", title:"Next.js App Router ile Sunucu Bileşenleri", author:"u1", date:"27 Eylül 2026", min:7, tags:["nextjs","react","typescript"],
   ex:"Sunucu bileşenleri, veriyi istemciye JavaScript göndermeden hazırlamanın en pratik yolu. Ne zaman \"use client\" demeniz gerektiğini örneklerle anlatıyorum.",
   body:[["p","Next.js 13 ile gelen App Router, varsayılan olarak her bileşeni <b>sunucu bileşeni</b> kabul eder. Bu, bileşenin kodunun tarayıcıya hiç gönderilmediği ve veritabanına doğrudan erişebildiği anlamına gelir."],
         ["h","Basit bir örnek"],
         ["pre","// app/blog/page.tsx\nimport { db } from \"@/lib/db\";\n\nexport default async function BlogPage() {\n  const posts = await db.post.findMany({\n    where: { status: \"APPROVED\" },\n    orderBy: { publishedAt: \"desc\" },\n  });\n  return <PostList posts={posts} />;\n}"],
         ["p","Burada <code>useEffect</code> ya da ayrı bir API çağrısı yok. Sorgu sunucuda çalışır ve sonuç HTML olarak gelir."],
         ["h","Ne zaman \"use client\" gerekir?"],
         ["p","Bileşen <code>useState</code>, <code>onClick</code> gibi tarayıcı etkileşimlerine ihtiyaç duyuyorsa dosyanın en üstüne <code>\"use client\"</code> yazılır. Kural basit: etkileşimi olabildiğince küçük bileşenlere taşıyın, sayfanın geri kalanı sunucuda kalsın."]]},
  {id:"p2", cat:"Veri Bilimi", title:"PostgreSQL'de Index Ne Zaman İşe Yarar?", author:"u3", date:"25 Eylül 2026", min:6, tags:["postgresql","sql","performans"],

   body:[["p","Index, tablodaki satırlara hızlı ulaşmak için tutulan ek bir veri yapısıdır. Okumayı hızlandırır ama her yazma işleminde güncellenmesi gerekir."],
         ["pre","EXPLAIN ANALYZE\nSELECT * FROM score_events\nWHERE user_id = 42\n  AND created_at >= now() - interval '7 days';"],

  {id:"p3", cat:"Siber Güvenlik", title:"SQL Injection'a Karşı Parametreli Sorgular", author:"u4", date:"24 Eylül 2026", min:5, tags:["güvenlik","sql","nodejs"],

let play = null;
function QuizPlay(id){
  const q = quiz(id); if(!q) return Quiz();
  if(!play || play.id!==id) play = {id, i:0, correct:0, picked:null, left:q.sec, done:false};
  const qs = QUESTIONS[q.cat];
  if(play.done){
    const score = play.correct*25;
    return `<div class="play"><button class="back" data-go="#quiz">← Quizlere dön</button>
      <div class="card result"><span class="eyebrow">// sonuç</span><h2>${q.title}</h2>
      <div class="score tnum">${score}<span style="font-size:24px;color:var(--muted)"> / 100</span></div>
      <p class="muted">${play.correct} / ${qs.length} doğru cevap · Puanın haftalık sıralamaya eklendi.</p>
      <div class="acts"><a class="btn" href="#siralama">Sıralamayı gör</a><a class="btn ghost" href="#quiz">Başka quiz çöz</a></div></div></div>`;
  }
  const [text, opts, ans] = qs[play.i];
  return `<div class="play"><button class="back" data-go="#quiz">← Quizlere dön</button>
    <div class="play-top"><div><span class="chip cat">${q.cat}</span> <b style="margin-left:6px">${q.title}</b></div><span class="timer tnum ${play.left<=10?"low":""}" id="timer">${mmss(play.left)}</span></div>
    <div class="bar"><i style="width:${(play.i/qs.length)*100}%"></i></div>
    <div class="card qbox">
      <span class="eyebrow">Soru ${play.i+1} / ${qs.length}</span>
      <h2>${esc(text)}</h2>
      <div class="opts">${opts.map((o,k)=>{
        let cls=""; if(play.picked!==null){ if(k===ans) cls="right"; else if(k===play.picked) cls="wrong"; }
        return `<button class="opt ${cls}" data-k="${k}" ${play.picked!==null?"disabled":""}><span class="l">${"ABCD"[k]}</span>${esc(o)}</button>`}).join("")}</div>
      ${play.picked!==null?`<div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="btn" id="next">${play.i+1<qs.length?"Sonraki soru":"Sonucu gör"}</button></div>`:""}
    </div></div>`;
}
let timerH=null;
function startTimer(){
  clearInterval(timerH);
  timerH=setInterval(()=>{
    if(!play||play.done||!location.hash.startsWith("#quiz-")){clearInterval(timerH);return;}
    play.left--; const t=$("#timer");
    if(play.left<=0){play.done=true;clearInterval(timerH);render();return;}
    if(t){t.textContent=mmss(play.left); t.classList.toggle("low",play.left<=10);}
  },1000);
}

let profTab="posts";
function heat(seed){
  let s=seed, out=""; const r=()=>{s=(s*9301+49297)%233280;return s/233280};
  for(let i=0;i<26*7;i++){const v=r(); const l=v<.38?0:v<.6?1:v<.78?2:v<.92?3:4; out+=`<i class="${l?"l"+l:""}"></i>`;}
  return out;
}
function Profile(id){
  const u=user(id||"u1")||user("u1"); const own=u.id==="u1";
  const rankW=sorted("w").findIndex(x=>x.id===u.id)+1;
  const myPosts=POSTS.filter(p=>p.author===u.id).map(p=>({t:p.title,cat:p.cat,st:"ok",date:p.date}));
  if(own) myPosts.push({t:"Auth.js ile Rol Tabanlı Yetkilendirme",cat:"Web",st:"wait",date:"Onay bekliyor"},{t:"Docker Desktop ile Backend Takibi",cat:"Web",st:"draft",date:"Taslak"});
  const stLbl={ok:"Yayında",wait:"Onay bekliyor",draft:"Taslak"};
  const hist=[["Next.js ve React Temelleri","Web",75,"28 Eyl"],["Web Güvenliği 101","Siber Güvenlik",100,"26 Eyl"],["Makine Öğrenmesine Giriş","Yapay Zeka",50,"23 Eyl"],["Pandas ve SQL ile Veri Analizi","Veri Bilimi",75,"20 Eyl"]];
  const tabs=[["posts",own?"Yazılarım":"Yazılar",myPosts.length],["quiz","Quiz geçmişi",hist.length]];
  const adminCount=pendingUsers.length+pendingPosts.length+reported.length;
  if(own) tabs.push(["admin","Admin paneli",adminCount]);
  if(!own && profTab==="admin") profTab="posts";
  let body="";
  if(profTab==="posts") body=myPosts.length?myPosts.map(p=>`<div class="list-row"><div class="t"><b>${esc(p.t)}</b><span>${p.cat} · ${p.date}</span></div><span class="pill ${p.st}">${stLbl[p.st]}</span></div>`).join(""):`<div class="empty">Henüz yayınlanmış yazı yok.</div>`;
  if(profTab==="quiz") body=`<div class="tbl-wrap"><table class="tnum"><thead><tr><th>Quiz</th><th>Kategori</th><th class="r">Puan</th><th class="r">Tarih</th></tr></thead><tbody>${hist.map(h=>`<tr style="cursor:default"><td>${h[0]}</td><td><span class="chip cat">${h[1]}</span></td><td class="r mono">${h[2]}</td><td class="r muted">${h[3]}</td></tr>`).join("")}</tbody></table></div>`;
  if(profTab==="admin") body=`
    <div class="admin-h">Üyelik onayı bekleyenler · ${pendingUsers.length}</div>
    ${pendingUsers.length?pendingUsers.map((p,i)=>`<div class="list-row"><span class="av alt">${ini(p.name)}</span><div class="t"><b>${esc(p.name)}</b><span>${p.hsd} · <span class="mono">${esc(p.mail)}</span> · ${p.when}</span></div><div class="acts"><button class="btn sm good" data-a="uok" data-i="${i}">Onayla</button><button class="btn sm bad" data-a="uno" data-i="${i}">Reddet</button></div></div>`).join(""):`<div class="empty">Onay bekleyen üye yok.</div>`}
    <div class="admin-h">Yayın onayı bekleyen yazılar · ${pendingPosts.length}</div>
    ${pendingPosts.length?pendingPosts.map((p,i)=>`<div class="list-row"><div class="t"><b>${esc(p.title)}</b><span>${p.by} · ${p.cat}</span></div><div class="acts"><button class="btn sm good" data-a="pok" data-i="${i}">Yayınla</button><button class="btn sm bad" data-a="pno" data-i="${i}">Reddet</button></div></div>`).join(""):`<div class="empty">Onay bekleyen yazı yok.</div>`}
    <div class="admin-h">Bildirilen hesaplar · ${reported.length}</div>
    ${reported.length?reported.map((p,i)=>`<div class="list-row"><div class="t"><b>${esc(p.name)}</b><span>${esc(p.why)}</span></div><div class="acts"><button class="btn sm ghost" data-a="rr" data-i="${i}">Kısıtla</button><button class="btn sm bad" data-a="rb" data-i="${i}">Banla</button></div></div>`).join(""):`<div class="empty">Bildirilen hesap yok.</div>`}`;
  return `
  ${own?"":`<button class="back" data-go="#siralama">← Sıralamaya dön</button>`}
  <div class="prof">
    <aside class="card prof-side">
      <span class="av lg ${own?"":"alt"}">${ini(u.name)}</span>
      <div><h2>${esc(u.name)}</h2><span class="handle">@${u.handle}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip cat">${u.hsd}</span>${u.admin?'<span class="chip">Admin</span>':""}</div>
      <p class="bio">${own?"İGÜ HSD · HSDCode+ proje yöneticisi. Backend, deploy ve ekip mentörlüğü. Next.js, Node.js ve PostgreSQL ile çalışıyorum.":"HSD üyesi. Teknik yazılar paylaşıyor ve quizlere katılıyor."}</p>
      <ul>${own?`<li>Rol: <span>${u.role}</span></li>`:""}<li>Katılım: <span>${own?"Eylül 2026":"Mart 2026"}</span></li><li>GitHub: <span class="mono">github.com/${u.handle}</span></li></ul>
      ${own?`<button class="btn ghost" id="editp">Profili düzenle</button>`:""}
    </aside>
    <div style="display:grid;gap:20px;min-width:0">
      <div class="kpis tnum">
        <div class="card kpi"><span>Toplam puan</span><b>${fmt(u.m)}</b><small>+${fmt(u.w)} bu hafta</small></div>
        <div class="card kpi"><span>Haftalık sıra</span><b>#${rankW}</b><small style="color:${u.dw<0?"var(--bad)":u.dw>0?"var(--good)":"var(--muted)"}">${u.dw>0?"▲ "+u.dw:u.dw<0?"▼ "+(-u.dw):"değişmedi"}</small></div>
        <div class="card kpi"><span>Yayınlanan yazı</span><b>${POSTS.filter(p=>p.author===u.id).length+(own?5:2)}</b><small>${own?"1 onay bekliyor":"&nbsp;"}</small></div>
        <div class="card kpi"><span>Çözülen quiz</span><b>${own?23:Math.round(u.m/90)}</b><small>%${own?81:74} başarı</small></div>
      </div>
      <div class="card heat-wrap"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><h3 style="font-size:15px">Son 6 ay etkinlik</h3><span class="muted" style="font-size:13px">Quiz, yazı ve yorumlar</span></div>
        <div class="heat" aria-hidden="true">${heat(u.handle.length*7+u.m)}</div>
        <div class="heat-legend">Az <i style="background:var(--surface-2)"></i><i style="background:var(--accent);opacity:.3"></i><i style="background:var(--accent);opacity:.55"></i><i style="background:var(--accent);opacity:.8"></i><i style="background:var(--accent)"></i> Çok</div></div>
      <div class="card" style="overflow:hidden">
        <div class="tabs" id="pt" style="padding-inline:12px">${tabs.map(([k,v,c])=>`<button class="${k===profTab?"on":""}" data-t="${k}">${v}<span class="count">${c}</span></button>`).join("")}</div>
        <div>${body}</div>
      </div>
    </div>
  </div>`;
}

function render(){
  const h=(location.hash||"#home").slice(1); const [r,id]=h.split(/-(.+)/);
  let html;
  if(r==="quiz"&&id) html=QuizPlay(id);
  else if(r==="quiz") html=Quiz();
  else if(r==="blog"&&id==="yeni") html=Editor();
  else if(r==="blog"&&id) html=Article(id);
  else if(r==="blog") html=Blog();
  else if(r==="siralama") html=Board();
  else if(r==="hakkimizda") html=About();
  else if(r==="profil") html=Profile(id);
  else html=Home();
  app.innerHTML=html;
  document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("on",a.dataset.r===(r||"home")||(r===""&&a.dataset.r==="home")));
  $("#links").classList.remove("open");
  if(r==="quiz"&&id&&play&&!play.done&&play.picked===null) startTimer();
}
let lastRoute="";
window.addEventListener("hashchange",()=>{
  const h=location.hash; if(h.startsWith("#quiz-")&&h!==lastRoute) play=null;
  if(h.startsWith("#profil")&&h!==lastRoute) profTab="posts";
  lastRoute=h; render(); window.scrollTo(0,0);
});

app.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-u]"); if(!t) return;
  if(t.dataset.go){location.hash=t.dataset.go;return;}
  if(t.closest("#qf")&&t.dataset.c){quizFilter=t.dataset.c;render();return;}
  if(t.closest("#bf")&&t.dataset.c){blogFilter=t.dataset.c;render();return;}
  if(t.closest("#lp")&&t.dataset.p){lbP=t.dataset.p;render();return;}
  if(t.closest("#pt")&&t.dataset.t){profTab=t.dataset.t;render();return;}
  if(t.dataset.u){location.hash="#profil-"+t.dataset.u;return;}
  if(t.classList.contains("opt")&&play&&play.picked===null){
    play.picked=+t.dataset.k; clearInterval(timerH);
    const q=quiz(play.id); if(play.picked===QUESTIONS[q.cat][play.i][2]) play.correct++;
    render(); return;
  }
  if(t.id==="next"){const q=quiz(play.id); play.i++; play.picked=null; if(play.i>=QUESTIONS[q.cat].length) play.done=true; render(); if(!play.done) startTimer(); return;}
  if(t.id==="draft"){toast("Taslak kaydedildi.");return;}
  if(t.id==="editp"){toast("Profil düzenleme bu prototipte kapalı.");return;}
  const a=t.dataset.a, i=+t.dataset.i;
  if(a==="uok"){toast(`${pendingUsers[i].name} üyeliği onaylandı.`);pendingUsers.splice(i,1);render();}
  if(a==="uno"){toast(`${pendingUsers[i].name} başvurusu reddedildi.`);pendingUsers.splice(i,1);render();}
  if(a==="pok"){toast(`"${pendingPosts[i].title}" yayınlandı.`);pendingPosts.splice(i,1);render();}
  if(a==="pno"){toast("Yazı gerekçesiyle birlikte yazara geri gönderildi.");pendingPosts.splice(i,1);render();}
  if(a==="rr"){toast(`${reported[i].name} 7 gün süreyle kısıtlandı.`);reported.splice(i,1);render();}
  if(a==="rb"){toast(`${reported[i].name} banlandı.`);reported.splice(i,1);render();}
});
app.addEventListener("keydown",e=>{const t=e.target.closest("[data-u]"); if(t&&e.key==="Enter") location.hash="#profil-"+t.dataset.u;});
app.addEventListener("input",e=>{
  if(e.target.id==="bq"){blogQ=e.target.value;
    const list=POSTS.filter(p=>(blogFilter==="Tümü"||p.cat===blogFilter)&&(p.title+p.ex+p.tags.join(" ")).toLocaleLowerCase("tr").includes(blogQ.toLocaleLowerCase("tr")));
    $("#blist").innerHTML=list.length?list.map(postCard).join(""):`<div class="card empty" style="grid-column:1/-1">Aramana uyan yazı bulunamadı. Farklı bir kelime dene.</div>`;}
});
app.addEventListener("change",e=>{if(e.target.id==="lh"){lbH=e.target.value;render();}});
app.addEventListener("submit",e=>{if(e.target.id==="ef"){e.preventDefault();toast("Yazın admin onayına gönderildi.");setTimeout(()=>location.hash="#profil",900);}});

$("#burger").addEventListener("click",()=>$("#links").classList.toggle("open"));
$("#theme").addEventListener("click",()=>{
  const root=document.documentElement;
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("hsd-theme",root.dataset.theme)}catch(_){}
});
